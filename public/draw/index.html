<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    PHONE-STAGE §2 (one paper) + §4.1 (identical first paint).
    This rule is the first thing in the document and runs before any script:
    the seam to /phone.html is only invisible if there is nothing different to
    flash to. #dfdfdf is SURFACE.ground (src/taste/tokens.ts).
  -->
  <style>html, body { background: #dfdfdf; }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>draw → 3d</title>
  <!-- the shell is the first thing the eye lands on; fetch it alongside the
       document rather than after the scripts (DEVICE §1a — it must not fade in) -->
  <link rel="preload" as="image" href="/device/shell.svg" />
  <style>
    /*
     * The device (docs/DEVICE.md) wrapping the stage (docs/PHONE-STAGE.md §2).
     *
     * Two objects, two laws:
     *   the DEVICE is a prop drawn in the illustrated world. It never moves —
     *   no transition, no animation, ever (DEVICE §1a). A tamagotchi whose
     *   plastic case breathed would read as wrong.
     *   the SCREEN WELL holds the stage exactly as it was: one surface that
     *   never moves, four slots, the core as the fixed point, the ambient
     *   drift floor running under everything (TASTE §2.1).
     *
     * Every colour and duration below is MIRRORED from src/taste/tokens.ts.
     * This page is a standalone document in public/ and cannot import from
     * src/, so the duplication is made explicit here rather than scattered as
     * magic numbers. Keep the two in step.
     */
    :root {
      /* ── palette — src/taste/tokens.ts SURFACE / WORLD ──────────────── */
      --paper: #dfdfdf;   /* SURFACE.ground — the world's field, one paper end to end */
      --pad:   #e9ebe9;   /* SURFACE.canvas — the drawing ground, and the device body */
      --ink:   #353534;   /* WORLD.ink */
      --muted: #92928e;   /* WORLD.neutral */
      --line:  rgba(53, 53, 52, 0.22);
      /* paper at 0.72 — a scrim, so the stage stays visible behind a modal (§5) */
      --scrim: rgba(223, 223, 223, 0.72);

      /* ── motion — src/taste/tokens.ts MOTION ────────────────────────── */
      --t-tertiary:  456ms;    /* MOTION.tertiaryMs  — satellites out, key states */
      --t-secondary: 912ms;    /* MOTION.secondaryMs — satellites in, core, modals, the seam */
      --t-primary:   1823ms;   /* MOTION.primaryMs   — toast dwell */
      --t-ambient:   3646ms;   /* MOTION.ambientMs   — the drift floor */
      --settle: cubic-bezier(0.17, 0.72, 0.24, 1.0);   /* MOTION.settleCurve — ζ ≥ 1, no overshoot */
      --stagger: calc(var(--t-tertiary) / 4);          /* 114ms — derived, PHONE-STAGE §3 */
      --slide: 8px;                                    /* satellite offset, PHONE-STAGE §3 */

      /* an unassigned or unavailable key dims rather than leaving (DEVICE §2) */
      --dim: 0.3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0; overflow: hidden;
      background: var(--paper); color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%;
    }

    /* ── the stage ──────────────────────────────────────────────────────────
       Fixed and full-bleed. It owns the paper the device is drawn on, and it
       owns every measure the device and the well are built from, so that one
       element resolves the whole geometry and both pages can copy it. */
    .stage {
      position: fixed; inset: 0; background: var(--paper); overflow: hidden;
      display: grid; place-items: center;
      /* the device box measures against THIS element, not against vh: a
         container query length is exact where vh and a fixed inset disagree
         on mobile. src/phone/device.ts does the same, so both halves of the
         seam resolve the identical box. */
      container-type: size;
    }

    /* ── the device ─────────────────────────────────────────────────────────
       A prop in the illustrated world, not a ui panel (DEVICE §1d): a light
       paper-filled shape carried by wobbly ink outlines, exactly like the
       trees. shell.svg is viewBox 0 0 100 150, so the box is 2:3 and sized
       CONTAIN: the hand-drawn line weight never stretches, and extra viewport
       height becomes paper above and below. */
    .device-box {
      position: relative;
      width: min(100cqw, calc(100cqh * 100 / 168));
      aspect-ratio: 100 / 168;

      /* the same measure again as a length, so the screen's own geometry can
         be derived from it (a percentage cannot feed calc() in `translate`). */
      --device-w: min(100cqw, calc(100cqh * 100 / 168));

      /* DEVICE §3 — the screen well, x 15–85 / y 38–124 of the viewBox. The
         well is PORTRAIT (0.7·w wide, 0.86·w tall): a square well left the
         brow nowhere to sit but on top of the drawing. --well-side is its
         WIDTH, which is what bounds the square core. */
      --well-side: calc(var(--device-w) * 0.7);
      --well-pad:  calc(var(--well-side) * 0.032);

      /* DEVICE §3 — the core's measure is now a share of the WELL's short
         side, not of the viewport. draw 95%, wait 75%; the ratio between the
         two is what the seam is built on. */
      --core-side: calc(var(--well-side) * 0.95);
      /* MOTION.ambientAmplitude (0.003 of scale) — declared here, next to the
         --core-side it is measured against: a custom property resolves its
         var()s on the element that declares it, so this cannot live on :root. */
      --ambient-amp: calc(var(--core-side) * 0.003);

      /* screen type scales with the screen, so a 273px well and a 700px one
         read the same. The clamps keep it legible at either end. */
      --screen-1: clamp(11px, calc(var(--well-side) * 0.052), 17px);
      --screen-2: clamp(9px,  calc(var(--well-side) * 0.042), 14px);
    }
    /* the wait measure. The core arrives here BEFORE the navigation fires, so
       the companion can boot with the box already this size (§4.2). */
    .stage[data-state="sending"] .device-box { --core-side: calc(var(--well-side) * 0.75); }

    /* the shell artwork. It never transitions, never animates and carries no
       transform (DEVICE §1a) — the case is a physical object. The real
       controls are separate elements; this is only the drawing of them. */
    .device-shell {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }

    /* ── the screen well ────────────────────────────────────────────────────
       DEVICE §3. The stage's four slots live in here with their roles
       unchanged. Depth is value only (DEVICE §1e): the well is painted one
       step darker than the body by the artwork itself, so it reads as inset
       with no shadow, no gradient and no rounding of ours. */
    .device-well {
      position: absolute;
      left: 15%; top: 22.619%; width: 70%; height: 51.19%;
      overflow: hidden;
    }

    /* ── slots (always present; empty is a state, never a removal) ────────── */
    .slot { position: absolute; }
    .slot.satellite { z-index: 2; }
    /* the well is portrait (DEVICE §3), so the brow has its own band above the
       square core and no longer floats over the drawing
       the way a handheld's status row floats over its play field. It takes no
       pointer events — the pad underneath keeps its whole surface — except on
       the one word that is a control. */
    .stage-brow   { top: var(--well-pad); left: var(--well-pad); right: var(--well-pad); pointer-events: none; }
    .stage-brow .chip-change { pointer-events: auto; }
    /* tools render into the device's own keys now (DEVICE §2), so this slot is
       empty here. It stays in the dom: removing a slot relayouts the stage. */
    .stage-tools  { bottom: var(--well-pad); left: var(--well-pad); right: var(--well-pad); pointer-events: none; }
    .stage-corner { right: var(--well-pad); bottom: var(--well-pad); width: 0; height: 0; }
    /* the core: inset 0 + auto margins centres it exactly; only the side
       changes, and it changes as real layout, never as a scale. */
    .stage-core {
      inset: 0; margin: auto; z-index: 1;
      width: var(--core-side); height: var(--core-side);
      transition: width var(--t-secondary) var(--settle), height var(--t-secondary) var(--settle);
    }

    /* ── satellite choreography (PHONE-STAGE §3) ──────────────────────────
       in:  opacity 0→1, translate +8px→0, over t.secondary, delay (i+1)·stagger
       out: opacity 1→0, translate 0→+8px, over t.tertiary,  delay  i   ·stagger
       `translate` rather than `transform` so nothing on this page ever reports
       a transform at all — there is no scale to get wrong. */
    .satellite {
      opacity: 1; translate: 0 0;
      transition: opacity var(--t-secondary) var(--settle),
                  translate var(--t-secondary) var(--settle);
      transition-delay: calc(var(--stagger) * (var(--i) + 1));
    }
    .satellite.is-out {
      opacity: 0; translate: 0 var(--slide); pointer-events: none;
      transition-duration: var(--t-tertiary);
      transition-delay: calc(var(--stagger) * var(--i));
    }

    /* ── the ambient floor (TASTE §2.1) ───────────────────────────────────
       Nothing on the stage ever fully arrests. It runs on the satellites, at
       0.3% of the stage's own scale, and deliberately NOT on the core: the
       core is the fixed point the seam is measured against (§3, §4.2), so the
       floor never spends its 1px budget. It never runs on the device either —
       the case is still by ruling. Phase-offset per slot so the screen does
       not breathe in unison. */
    .drift {
      animation: ambient-floor var(--t-ambient) var(--settle) infinite alternate;
      animation-delay: calc(var(--t-ambient) / -3 * var(--i));
    }
    @keyframes ambient-floor {
      from { translate: 0 calc(var(--ambient-amp) * -1); }
      to   { translate: 0 var(--ambient-amp); }
    }

    /* ── brow ─────────────────────────────────────────────────────────────── */
    .brow-line { display: flex; align-items: center; justify-content: center; gap: 8px; }
    /* min-width 0 is what lets the title actually ellipsis inside a flex row —
       ?title= carries up to 40 characters and the well is only ~250px wide */
    .title { flex: 1 1 auto; min-width: 0; font-weight: 500; font-size: var(--screen-1); letter-spacing: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; font-size: var(--screen-2); color: var(--muted); white-space: nowrap; }
    /* Connection state without color: a hollow ring waiting, filled live. */
    .dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--muted);
      background: transparent;
      transition: background var(--t-tertiary) var(--settle), border-color var(--t-tertiary) var(--settle); }
    .dot.on { background: var(--ink); border-color: var(--ink); }
    .dot.off { background: transparent; border-color: var(--line); }

    .namechip {
      margin-top: 6px; font-size: var(--screen-2); color: var(--muted); text-align: center;
      opacity: 0; translate: 0 var(--slide); pointer-events: none;
      transition: opacity var(--t-secondary) var(--settle),
                  translate var(--t-secondary) var(--settle);
      transition-delay: var(--stagger);
    }
    .namechip.is-in { opacity: 1; translate: 0 0; }
    .namechip b { color: var(--ink); font-weight: 500; }
    .chip-change { color: var(--ink); text-decoration: underline; cursor: pointer; }

    /* ── core: the pad ────────────────────────────────────────────────────── */
    .pad {
      position: relative; width: 100%; height: 100%;
      /* No card of its own (DEVICE §3): the bezel in the artwork is the only
         frame and the well's own value is the only ground. A pad carrying a
         background, a border and a radius reads as a card sitting ON the
         screen rather than being the screen. */
      overflow: hidden;
      touch-action: none;
      transition: opacity var(--t-secondary) var(--settle);
    }
    /* the seam: the pad's content leaves, the box stays and travels (§4.2) */
    .stage[data-state="sending"] .pad { opacity: 0; pointer-events: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: var(--screen-1); font-weight: 400; pointer-events: none;
      opacity: 0; transition: opacity var(--t-secondary) var(--settle); }
    .stage[data-state="idle"] .hint { opacity: 1; }

    /* ── the three keys (DEVICE §2, §3) ─────────────────────────────────────
       A physical device has fixed controls, so all three are always present
       and never leave; what changes is what they mean, and an unavailable one
       dims rather than going away. The drawn ring in shell.svg is artwork —
       these are the real controls, sitting on the geometry DEVICE §3 pins:
       centres x 30.5 / 50 / 70, centre line y 128, diameter 14.4 of the box.
       They carry no transform and never move; only their value changes, and
       it changes on the settle curve because a hard cut is forbidden. */
    /* a zero-height line on the drawn row centre; each key hangs off it by
       half its own diameter, and a percentage margin resolves against the box
       WIDTH — the axis the diameter is quoted in. Same construction as
       src/phone/device.ts, so the two pages land on the same pixels. */
    .device-keys { position: absolute; left: 0; width: 100%; top: 86.31%; height: 0; }
    .device-key {
      position: absolute; top: 0;
      width: 14.4%; aspect-ratio: 1;
      margin-top: -7.2%; margin-left: -7.2%;
      display: flex; align-items: center; justify-content: center;
      padding: 0; border: 0; border-radius: 50%; background: transparent;
      color: var(--ink); cursor: pointer; touch-action: manipulation;
      transition: opacity var(--t-tertiary) var(--settle);
    }
    .device-key[data-key="0"] { left: 30.5000%; }
    .device-key[data-key="1"] { left: 50.0000%; }
    .device-key[data-key="2"] { left: 70.0000%; }
    .device-key:disabled { opacity: var(--dim); cursor: default; pointer-events: none; }
    /* the mark on a key is an icon, never a filled shape — `icon` is the mark
       set's first entry (TASTE §4) and it is what the companion draws too. */
    .device-key svg { width: 46%; height: 46%; display: block; }

    /* ── tools (the modal buttons; the pad's own tools are the keys) ──────── */
    button { border: 1px solid var(--line); border-radius: 13px; padding: 15px; font-size: 16px; font-weight: 500;
      font-family: inherit; cursor: pointer; letter-spacing: 0;
      transition: opacity var(--t-tertiary) var(--settle), border-color var(--t-tertiary) var(--settle); }
    /* press feedback drifts on the settle curve — no scale, no snap back */
    button:active { opacity: 0.62; }
    .clear { background: transparent; color: var(--ink); }

    /* spent: this handset already drew (one handset, one creature). Everything
       recedes while the companion loads — a fade, not a removal. The shell
       itself does not dim: it is the object, not the state. */
    .stage[data-spent="true"] .satellite,
    .stage[data-spent="true"] .stage-core { opacity: 0.35; pointer-events: none; }
    .stage[data-spent="true"] .device-key { opacity: var(--dim); pointer-events: none; }

    /* ── toast (the scene's back channel) ─────────────────────────────────
       it is a message from the world to this screen, so it lives on the
       screen — inside the well, not floating on the case. */
    .toast { position: absolute; left: 50%; bottom: 7%; translate: -50% var(--slide); z-index: 3;
      max-width: 88%; background: var(--ink); color: var(--pad); font-weight: 500;
      padding: 9px 15px; border-radius: 999px;
      opacity: 0; pointer-events: none; font-size: var(--screen-2); text-align: center;
      transition: opacity var(--t-secondary) var(--settle), translate var(--t-secondary) var(--settle); }
    .toast.show { opacity: 1; translate: -50% 0; }

    /* ── modals (PHONE-STAGE §5) ──────────────────────────────────────────
       The name sheet and the guideline notice are interruptions, not steps in
       the flow: they slide up over the stage on the settle curve and leave the
       stage visible behind them. No display toggling — opacity, pointer-events
       and aria-hidden only. They stay anchored to the viewport rather than to
       the well: the sheet owns a text input, and an input inside a 273px well
       would sit under the on-screen keyboard. */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center;
      background: var(--scrim); opacity: 0; pointer-events: none;
      transition: opacity var(--t-secondary) var(--settle); }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-card { width: 100%; max-width: 380px; background: var(--pad); border: 1px solid var(--line);
      border-radius: 20px; padding: 22px;
      translate: 0 calc(var(--slide) * 3);
      transition: translate var(--t-secondary) var(--settle); }
    .modal.show .modal-card { translate: 0 0; }

    /* the sheet stays top-anchored: it owns a text input, and a bottom sheet
       sits under the on-screen keyboard. It still slides up into place. */
    .sheet { align-items: flex-start; padding: 11vh 18px 0; }
    .refused { align-items: center; padding: 0 18px; }
    .refused .modal-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .refused p { margin: 0; font-size: 17px; line-height: 1.45; max-width: 22em; }
    .refused .sub { font-size: 14px; color: var(--muted); }
    .refused button { flex: 0 0 auto; }

    /* the sub line is gone (user ruling): the title is the whole prompt, so it
       carries the margin the sub used to. */
    .sheet-title { font-size: 20px; font-weight: 500; letter-spacing: 0; margin: 0 0 16px; }
    .name-input { width: 100%; font-size: 18px; font-weight: 400; padding: 15px 16px; border-radius: 13px;
      background: transparent; border: 1px solid var(--line); color: var(--ink); outline: none;
      user-select: text; -webkit-user-select: text;
      transition: border-color var(--t-tertiary) var(--settle); }
    .name-input:focus { border-color: var(--ink); }
    .sheet-go { width: 100%; margin-top: 14px; background: var(--ink); color: var(--pad); border-color: var(--ink); }
    .sheet-skip { width: 100%; margin-top: 6px; background: transparent; border-color: transparent; color: var(--muted);
      font-weight: 400; font-size: 14px; padding: 11px; }
  </style>
</head>
<body>
  <!-- One stage, one device, four slots. The slots never leave the dom
       (PHONE-STAGE §2) and the device never moves (DEVICE §1a). -->
  <div class="stage" id="stage" data-state="idle" data-spent="false">
    <div class="device-box" id="device">

      <!-- the shell: hand-drawn, black and white, static. Decorative — every
           control it draws has a real element over it. -->
      <img class="device-shell" id="deviceShell" src="/device/shell.svg" alt=""
           aria-hidden="true" draggable="false" />

      <!-- the screen well: the stage lives in here, unchanged -->
      <div class="device-well" id="well">

        <div class="slot satellite stage-brow" id="brow" style="--i: 0">
          <div class="drift">
            <div class="brow-line">
              <!-- No page title on the screen: the case already says `ref`, and a
                   device screen does not carry a page heading. It also did not fit
                   — title + status overflowed a 256px well and clipped at BOTH
                   edges. The dot alone carries connection state; its accessible
                   name carries the words. -->
              <span class="dot" id="dot" role="status" aria-label="connecting"></span>
            </div>
            <div class="namechip" id="namechip" aria-hidden="true"></div>
          </div>
        </div>

        <!-- the core: the square you draw in, which becomes the egg on the next
             page. It never translates and never scales — only its side changes. -->
        <div class="slot stage-core" id="core">
          <div class="pad" id="pad">
            <canvas id="c"></canvas>
            <div class="hint" id="hint">draw a solid shape</div>
          </div>
        </div>

        <!-- tools slot: its controls are the device's keys now (DEVICE §2), so
             it is empty here. Present anyway — empty is a state of a slot. -->
        <div class="slot satellite stage-tools" id="tools" style="--i: 1" aria-hidden="true">
          <div class="drift"></div>
        </div>

        <!-- corner slot: the minimap lives here on the companion. Empty here, and
             present anyway: removing a slot relayouts the stage, and that is a cut. -->
        <div class="slot satellite stage-corner" id="corner" style="--i: 2" aria-hidden="true"></div>

        <div class="toast" id="toast">sent</div>
      </div>

      <!--
        the keys. Real buttons with real names, sitting on the rings the shell
        draws. This page has no undo, so where DEVICE §2's draw row reads
        undo · clear · done, key 1 carries the page's other tool — the brush
        size — and keys 2 and 3 carry clear and send as the table says.
      -->
      <div class="device-keys" id="keys">
        <button type="button" class="device-key" data-key="0" id="keySize" aria-label="brush size">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle id="keySizeDot" cx="12" cy="12" r="5.6" fill="currentColor" /></svg>
        </button>
        <button type="button" class="device-key" data-key="1" id="clear" aria-label="clear">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path
            d="M8.2 8.3c2.3 2.2 4.7 4.7 7.3 7.5M15.8 8.4c-2.4 2.3-4.9 4.8-7.2 7.4"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button type="button" class="device-key" data-key="2" id="send" aria-label="send" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path
            d="M6.4 12.1c3.7-.3 7.4-.4 11.1-.3M13.3 8c1.4 1.3 2.8 2.6 4.2 3.8-1.4 1.3-2.8 2.6-4.1 4"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Refused on this handset: the drawing never leaves the phone. Same
       words the companion uses, shown here instead of a send. -->
  <div class="modal refused" id="refused" aria-hidden="true">
    <div class="modal-card">
      <p>sorry — this goes against our content guidelines.</p>
      <p class="sub">it was not sent.</p>
      <button class="clear" id="refusedBack">draw something else</button>
    </div>
  </div>

  <div class="modal sheet" id="sheet" aria-hidden="true">
    <div class="modal-card">
      <div class="sheet-title">sign your masterpiece</div>
      <input id="nameInput" class="name-input" type="text" maxlength="16" placeholder="first name"
             autocomplete="off" autocorrect="off" autocapitalize="words" enterkeyhint="go" />
      <button class="sheet-go" id="sheetGo">send</button>
      <button class="sheet-skip" id="sheetSkip">skip — let the world name it</button>
    </div>
  </div>

  <script src="./mqtt.min.js"></script>
  <!-- the content screen, built from src/moderation/ (see standalone.ts).
       absent on the dev server; the world's gate is the authority either way -->
  <script type="module" src="/screen.js"></script>
  <script>
  (() => {
    // ── Motion tokens ───────────────────────────────────────────────────────
    // Mirrored from MOTION in src/taste/tokens.ts (see the head stylesheet for
    // the css side). A standalone document cannot import them, so they are
    // named here once instead of appearing as literals at the call sites.
    const MOTION = {
      tertiaryMs: 456,
      secondaryMs: 912,
      primaryMs: 1823,
      ambientMs: 3646,
    };
    // Stagger is derived from the scale, never invented (PHONE-STAGE §3).
    const STAGGER_MS = MOTION.tertiaryMs / 4;   // 114ms

    // ── Config (must match the receiver's broker + topicPrefix) ─────────────
    const params = new URLSearchParams(location.search);
    const BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_PREFIX = 'drawto3d/v1/';
    // room from ?room= (or legacy ?topic=); everything sanitised
    const room = (params.get('room') || params.get('topic') || 'demo').replace(/[^a-z0-9_-]/gi, '') || 'demo';
    const TOPIC = TOPIC_PREFIX + room;

    // ── The stage ───────────────────────────────────────────────────────────
    // One surface; states are swaps of what occupies it, never screen changes.
    // idle → drawn → sending, plus refused (a modal over a withdrawn stage).
    const stage = document.getElementById('stage');
    // reading order — brow, tools, corner (PHONE-STAGE §3). --i is on the
    // elements themselves and drives both the stagger and the ambient phase.
    const SATELLITES = ['brow', 'tools', 'corner'].map((id) => document.getElementById(id));
    // the device's three keys. They are always present and never leave
    // (DEVICE §2) — an unavailable one dims, it does not go away.
    const keyClear = document.getElementById('clear');
    const keySend  = document.getElementById('send');
    const keySize  = document.getElementById('keySize');
    const keySizeDot = document.getElementById('keySizeDot');

    function setPresent(el, present) {
      el.classList.toggle('is-out', !present);
      el.setAttribute('aria-hidden', present ? 'false' : 'true');
    }

    /**
     * The keys' availability, in one place. This is what used to be the
     * actions row arriving and leaving; the keys are on the case now, so
     * instead of sliding away they dim. Same rule, same moments:
     *   send  — offered once there is something to send AND a connection
     *   clear — offered once there is something to clear
     * and neither is live while the stage is mid-seam or already spent.
     */
    function syncKeys() {
      const busy = state === 'sending' || state === 'refused' || stage.dataset.spent === 'true';
      keySend.disabled  = busy || strokes.length === 0 || !connected;
      keyClear.disabled = busy || strokes.length === 0;
    }

    let state = 'idle';
    function setState(next) {
      if (state === next) return;
      state = next;
      stage.dataset.state = next;
      const satellitesIn = next === 'idle' || next === 'drawn';
      for (const el of SATELLITES) setPresent(el, satellitesIn);
      // clear/send are only live once there is something to send; they no
      // longer travel — the case they sit on is a solid object.
      syncKeys();
    }

    // ── one handset, one creature (user ruling) ──────────────────────────
    // The drawer id is stable per device and travels as the drawing's id,
    // so the world (which keys creatures by that id and replaces a slot of
    // the same id) can never hold two creatures for this phone. These keys
    // mirror src/phone/identity.ts — keep the two in step.
    const DRAWER_KEY = 'refworld:drawer';
    const SUBMISSION_KEY = 'refworld:submission:' + room;
    function drawerId() {
      try {
        let id = localStorage.getItem(DRAWER_KEY);
        if (!id) {
          id = 'd' + Math.floor(Math.random() * 0xffffffff).toString(36)
                   + Math.floor(Math.random() * 0xffff).toString(36);
          localStorage.setItem(DRAWER_KEY, id);
        }
        return id;
      } catch {
        return 'd' + Math.random().toString(36).slice(2, 10);
      }
    }
    const MY_ID = drawerId();
    // Which world this pad is drawing into. The join code carries it, so a
    // world that restarted (and lost every creature) hands out a new one —
    // and a handset holding a record from the old world is let in to draw
    // again rather than bounced to a creature that no longer exists.
    const WORLD_EPOCH = (params.get('w') || '').replace(/[^a-z0-9]/gi, '').slice(0, 16);
    function storedSubmission() {
      try { return JSON.parse(localStorage.getItem(SUBMISSION_KEY) || 'null'); } catch { return null; }
    }
    function staleRecord(rec) {
      // Only a KNOWN mismatch frees the handset: with no epoch in the url
      // (an old bookmark, a hand-typed address) the record stands.
      if (!rec || !WORLD_EPOCH) return false;
      return typeof rec.epoch !== 'string' || rec.epoch !== WORLD_EPOCH;
    }
    // Already drew in this room? The pad is not offered again — go straight
    // to the companion, which restores that creature from the same record.
    //
    // This has to survive the BACK BUTTON, which is how a second drawing
    // actually got submitted (user report): a back navigation restores this
    // page from the bfcache with its dom and script state intact and does
    // NOT re-run the script, so a load-time check alone never fires. The
    // pageshow handler covers the restore, and the pad is disabled outright
    // as a second line of defence in case navigation is refused.
    function alreadyDrew() {
      const rec = storedSubmission();
      if (!rec) return false;
      if (staleRecord(rec)) {
        // That world is gone; forget the creature it held.
        try { localStorage.removeItem(SUBMISSION_KEY); } catch {}
        return false;
      }
      return true;
    }
    function goToCompanion() {
      location.replace('/phone.html?room=' + room + (WORLD_EPOCH ? '&w=' + WORLD_EPOCH : ''));
    }
    function enforceSingleDrawing() {
      if (!alreadyDrew()) return false;
      // Freeze the pad even if the navigation is slow or blocked. Both pages
      // paint the same paper, so this hand-off has nothing to flash to.
      stage.dataset.spent = 'true';
      const send = document.getElementById('send');
      if (send) send.disabled = true;
      const clear = document.getElementById('clear');
      if (clear) clear.disabled = true;
      goToCompanion();
      return true;
    }
    enforceSingleDrawing();
    // Fires on first load AND on every bfcache restore (event.persisted).
    window.addEventListener('pageshow', () => { enforceSingleDrawing(); });
    // Some browsers only surface a restore as a visibility change.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) enforceSingleDrawing();
    });
    const UP_TOPIC = TOPIC + '/up';   // scene → phone (two-way back channel)
    if (params.get('title')) { document.title = params.get('title').slice(0, 40); }

    // One ink, no picker (user ask). The world rasterizes every drawing to
    // a binary mask — the experience is black and white by ruling
    // (docs/GENERATOR.md §ruling 2) — so a palette only ever promised
    // something that never arrived. Strokes still carry `color` on the wire
    // so the kit's own payload shape is unchanged.
    const INK    = '#353534';   // WORLD.ink
    const SIZES  = [4, 8, 16];

    // ── Canvas (hi-dpi) ─────────────────────────────────────────────────────
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let DPR = Math.min(window.devicePixelRatio || 1, 3), W = 0, H = 0;
    function resize() {
      const r = cv.getBoundingClientRect();
      W = r.width; H = r.height;
      cv.width = W * DPR; cv.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      redraw();
    }

    // strokes stored NORMALISED (0..1) so the scene can redraw at any size
    let strokes = [], cur = null;
    let sizeIndex = 1;
    let size = SIZES[sizeIndex];

    function redraw() {
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const s of strokes) drawStroke(s);
      if (cur) drawStroke(cur);
    }
    function drawStroke(s) {
      if (s.pts.length < 1) return;
      ctx.strokeStyle = s.color; ctx.lineWidth = s.width;
      ctx.beginPath();
      ctx.moveTo(s.pts[0][0] * W, s.pts[0][1] * H);
      for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i][0] * W, s.pts[i][1] * H);
      if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] * W + 0.01, s.pts[0][1] * H);
      ctx.stroke();
    }
    const pt = (e) => {
      const r = cv.getBoundingClientRect();
      return [ (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height ];
    };
    cv.addEventListener('pointerdown', (e) => {
      if (state === 'sending') return;
      cv.setPointerCapture(e.pointerId);
      cur = { color: INK, width: size, pts: [pt(e)] };
      // the swap: the hint leaves the core, the keys come live on the case
      setState('drawn');
      redraw();
    });
    cv.addEventListener('pointermove', (e) => { if (cur) { cur.pts.push(pt(e)); redraw(); } });
    const endStroke = () => {
      if (!cur) return;
      strokes.push(cur); cur = null;
      syncKeys();
      redraw();
    };
    cv.addEventListener('pointerup', endStroke);
    cv.addEventListener('pointercancel', endStroke);

    /** back to an empty pad: strokes gone, hint back, keys withdrawn. */
    function resetPad() {
      strokes = []; cur = null; redraw();
      setState('idle');
      syncKeys();
    }

    // ── Tool ui: it lives on the case now (DEVICE §2) ───────────────────────
    // The three brush sizes are the same three values, reached from key 1:
    // the ring shows the ink dot it will draw with, so the control still
    // reads its own state without a second row of marks on the screen. The
    // radii are the old 8 / 12 / 20px dots expressed in the icon's 24-unit
    // box, so at a 390pt handset the mark is the size it always was.
    const SIZE_RADII = [3.7, 5.6, 9.3];
    function applySize() {
      size = SIZES[sizeIndex];
      keySizeDot.setAttribute('r', String(SIZE_RADII[sizeIndex]));
      keySize.setAttribute('aria-label', 'brush size ' + (sizeIndex + 1) + ' of ' + SIZES.length);
    }
    keySize.onclick = () => { sizeIndex = (sizeIndex + 1) % SIZES.length; applySize(); };
    applySize();
    keyClear.onclick = resetPad;

    // ── MQTT ────────────────────────────────────────────────────────────────
    let connected = false, client;
    const dot = document.getElementById('dot');
    const toast = document.getElementById('toast');
    // The words moved to the accessible name — the screen shows the mark only.
    function setStatus(kind, text) { dot.className = 'dot ' + kind; dot.setAttribute('aria-label', text); }
    function showToast(msg, ms = MOTION.primaryMs) {
      toast.textContent = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), ms);
    }
    try {
      client = mqtt.connect(BROKER, { clientId: 'draw_' + Math.random().toString(16).slice(2, 10), keepalive: 30, reconnectPeriod: 2000 });
      client.on('connect', () => { connected = true; setStatus('on', 'connected'); syncKeys(); client.subscribe(UP_TOPIC); });
      client.on('reconnect', () => setStatus('', 'reconnecting…'));
      client.on('close',  () => { connected = false; setStatus('off', 'offline'); });
      client.on('error',  () => setStatus('off', 'connection error'));
      // two-way: the scene can push messages back to phones (e.g. an ack, a prompt)
      client.on('message', (t, payload) => {
        if (t !== UP_TOPIC) return;
        try { const m = JSON.parse(payload.toString()); if (m && m.text) showToast(m.text); } catch {}
      });
    } catch (err) { setStatus('off', 'no realtime'); }

    // ── Name ("sign") — asked once, then remembered ─────────────────────────
    const NAME_KEY = 'drawto3d:name';
    let signed   = localStorage.getItem(NAME_KEY) !== null;
    let userName = (localStorage.getItem(NAME_KEY) || '').slice(0, 16);
    const sheet = document.getElementById('sheet');
    const nameInput = document.getElementById('nameInput');
    const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    function updateChip() {
      const chip = document.getElementById('namechip');
      // presence is opacity + aria, never display: a removal relayouts the brow
      chip.classList.toggle('is-in', signed);
      chip.setAttribute('aria-hidden', signed ? 'false' : 'true');
      if (!signed) return;
      chip.innerHTML = userName
        ? `sending as <b>${escapeHtml(userName)}</b> · <span class="chip-change">change</span>`
        : `sending anonymously · <span class="chip-change">add name</span>`;
      chip.querySelector('.chip-change').onclick = openSheet;
    }
    function openModal(el) { el.classList.add('show'); el.setAttribute('aria-hidden', 'false'); }
    function closeModal(el) { el.classList.remove('show'); el.setAttribute('aria-hidden', 'true'); }
    function openSheet() {
      nameInput.value = userName; openModal(sheet);
      setTimeout(() => { nameInput.focus(); nameInput.select(); }, STAGGER_MS);
    }
    function closeSheet() { closeModal(sheet); nameInput.blur(); }
    function commitName(v) {
      userName = (v || '').replace(/[<>&"]/g, '').trim().slice(0, 16);
      signed = true; localStorage.setItem(NAME_KEY, userName); updateChip();
    }

    /**
     * Screen on THIS handset before anything is sent. The world screens
     * again on arrival and remains the authority — this page can be
     * bypassed entirely — but refusing here means an explicit drawing
     * never leaves the phone, and the person is told on the pad instead
     * of two screens later.
     */
    function refusedHere() {
      const screen = window.__refworldScreen;
      if (typeof screen !== 'function') return false;   // dev server, or not built
      let verdict;
      try { verdict = screen(strokes); } catch { return false; }
      // Only an outright refusal stops the send. A 'hold' is uncertain by
      // design — it goes to the world for a person to decide, and the
      // drawer is told nothing about it.
      if (!verdict || verdict.verdict !== 'refuse') return false;
      // the stage withdraws its satellites and the notice slides up over it —
      // the drawing stays visible behind, at the same size, in the same place.
      setState('refused');
      openModal(document.getElementById('refused'));
      return true;
    }

    function publish() {
      if (state === 'sending') return;
      if (!strokes.length || !connected) return;
      // Last gate: one handset, one creature — whatever route reached here.
      if (alreadyDrew()) { enforceSingleDrawing(); return; }
      if (refusedHere()) return;
      const msg = { id: MY_ID, name: userName, strokes, ts: Date.now() };
      client.publish(TOPIC, JSON.stringify(msg), { qos: 0 });
      // Hand off to the companion's egg view: stash the drawing for the
      // wait screen (3D egg painted with it), then navigate.
      try {
        // id travels with the handoff: the companion's portrait salts its
        // synthesis with the same identity the world spawns under, so both
        // render the identical creature.
        sessionStorage.setItem('refworld:handoff', JSON.stringify({ id: msg.id, name: userName || null, room, strokes: msg.strokes, ts: msg.ts }));
        // Persisted too: a reload (or coming back later) must land on the
        // creature this handset already made, never on an empty pad.
        localStorage.setItem(SUBMISSION_KEY, JSON.stringify({ id: msg.id, name: userName || null, strokes: msg.strokes, ts: msg.ts, epoch: WORLD_EPOCH || null }));
      } catch {}
      keySend.disabled = true;
      // The seam (PHONE-STAGE §4). Satellites leave, the core travels to the
      // WAIT measure and its content fades, and only then do we navigate. The
      // delay is MOTION.secondaryMs because that is the duration of the move
      // it is waiting for — the companion boots with the core already there
      // and fades the egg up into it, so one object stayed put while its
      // content changed. Which is exactly what happened.
      setState('sending');
      setTimeout(() => {
        location.href = '/phone.html?room=' + room + '&handoff=1'
          + (WORLD_EPOCH ? '&w=' + WORLD_EPOCH : '');
      }, MOTION.secondaryMs);
    }

    document.getElementById('refusedBack').onclick = () => {
      closeModal(document.getElementById('refused'));
      resetPad();
    };

    keySend.onclick = () => {
      if (!strokes.length || !connected) return;
      if (!signed) { openSheet(); return; }   // first send → sign it; then remembered
      publish();
    };
    document.getElementById('sheetGo').onclick = () => { commitName(nameInput.value); closeSheet(); publish(); };
    document.getElementById('sheetSkip').onclick = () => { commitName(''); closeSheet(); publish(); };
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('sheetGo').click(); } });
    sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
    updateChip();
    syncKeys();

    window.addEventListener('resize', resize);
    resize();
  })();
  </script>
</body>
</html>
