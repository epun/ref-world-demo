<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="a hand drawn handheld creature device">
  <!--
    The device shell — a PROP in the illustrated world, not a ui panel.

    That distinction is what makes it legal: TASTE §4 bans filled panels and
    cards in the ui, but GENERATOR's ink-rendering section describes every
    form in the world as a "light, paper-filled shape carried entirely by
    rough, wobbly dark ink outlines". The device is built to that rule, so it
    sits in the same world as the trees rather than on top of it as chrome.

    Black and white by user ruling. No gradients, no drop shadows, no
    rounding beyond the organic contour itself — every one of those is a
    pattern this taste shows no evidence for.

    Values: ink #353534, device body #e9ebe9 (SURFACE.canvas), screen well
    #dfdfdf (SURFACE.ground) so the well reads DARKER than the body it is
    set into, which is what makes it read as inset without a shadow.

    Geometry is binding — docs/DEVICE.md §3 pins the screen well to
    x 10..90, y 30..112 of this viewBox, and both pages position the stage
    against those numbers.

    Static by ruling: nothing in this file moves. The screen's CONTENTS keep
    the world's motion; the object holding them does not.
  -->
  <g fill="none" stroke="#353534" stroke-linecap="round" stroke-linejoin="round">

    <!-- the lug: the little nub a keyring would go through -->
    <path d="M44.6 12.4c-.6-3.4.7-6.9 3.6-8.2 3.1-1.4 6.9.4 8 3.6.5 1.5.4 3.2-.2 4.7"
          fill="#e9ebe9" stroke-width="1.5"/>
    <path d="M47.9 9.9c-.2-1.4.5-2.6 1.7-2.9 1.3-.4 2.7.5 2.9 1.9" stroke-width="1.1"/>

    <!--
      the body. one closed wobbling contour, drawn as four unequal arcs so no
      two shoulders match — an egg that was drawn, not constructed.
    -->
    <path d="M50.2 10.6c14.9-.5 28.4 6.9 34.9 18.4 6.9 12.2 7.4 27.4 6.2 41.2
             -1.1 13.1-3.9 26.4-10.4 37.6-5.1 8.8-12.6 15.9-22.1 18.6
             -9.8 2.8-20.6 1.4-29.1-4.2-9.1-6-14.8-15.8-18-25.9
             -4.1-12.8-5.2-26.7-3.4-40 1.6-11.8 5.9-23.8 14.6-32.2
             7-6.7 16.6-10.3 26.2-10.6 z"
          fill="#e9ebe9" stroke-width="1.7"/>
    <!-- the second pass of a pen that went round twice; broken, not traced -->
    <path d="M22.4 34.1c-3.9 8.2-5.7 17.4-6 26.5" stroke-width="0.8" opacity="0.55"/>
    <path d="M79.6 96.4c-4.4 8.9-11.1 16.6-20 20.4" stroke-width="0.8" opacity="0.55"/>

    <!-- word mark. lowercase, always (TASTE §5). real text, not a path. -->
    <text x="50" y="24.6" font-family="'helvetica neue', helvetica, arial, sans-serif"
          font-size="7.2" font-weight="400" letter-spacing="0.5"
          text-anchor="middle" fill="#353534" stroke="none">ref</text>

    <!--
      the screen well — x 10..90, y 30..112 (docs/DEVICE.md §3).
      a thick sketchy bezel, deliberately not a rectangle: the corners are
      unequal and the edges bow. TASTE §2.5 — no rectilinear form.
    -->
    <path d="M11.4 33.8c12.6-1.5 25.4-2 38.1-1.9 12.9.1 25.9.5 38.7 2.1
             1.3 13.4 1.7 27 1.5 40.5-.2 12.4-.9 24.9-2.2 37.2
             -12.5 1.4-25.2 1.9-37.8 1.8-12.9-.1-25.9-.6-38.7-2.1
             -1.4-13.1-1.8-26.4-1.6-39.6.2-12.7.9-25.4 2-38 z"
          fill="#dfdfdf" stroke-width="3.1"/>
    <!-- inner lip: a lighter second line just inside the bezel -->
    <path d="M14.2 37.1c11.8-1.2 23.7-1.6 35.6-1.5 12 .1 24.1.5 36 1.7
             1.1 12.3 1.5 24.7 1.3 37.1-.2 11.4-.8 22.8-2 34.1
             -11.7 1.1-23.5 1.5-35.3 1.4-12-.1-24.1-.5-36-1.7
             -1.2-12-1.6-24.2-1.4-36.3.2-11.6.8-23.2 1.8-34.8 z"
          stroke-width="0.9" opacity="0.5"/>

    <!--
      the glass. ONE flat hard-edged highlight, no gradient — the brief pairs
      hard light with a reflective surface, and TASTE §2.4 says a light shape
      in this world is cut sharp and flat-filled, never a penumbra.
    -->
    <path d="M18.6 40.2c6.4-.7 12.9-1 19.3-1.1-6.9 8.5-13 17.6-18.2 27.2
             -1-8.6-1.4-17.4-1.1-26.1 z"
          fill="#efecec" stroke="none" opacity="0.9"/>

    <!-- three buttons. a device has fixed controls; the states borrow them. -->
    <g stroke-width="1.5">
      <path d="M30.3 121.4c4.1-.5 7.8 2.7 7.9 6.7.1 3.9-3.2 7.3-7.1 7.3
               -4 0-7.3-3.4-7.1-7.4.1-3.4 2.8-6.3 6.3-6.6 z" fill="#dfdfdf"/>
      <path d="M50.2 121.3c4.1-.4 7.8 2.8 7.8 6.8 0 4-3.4 7.3-7.3 7.2
               -3.9-.1-7.1-3.5-6.9-7.4.2-3.4 2.9-6.2 6.4-6.6 z" fill="#dfdfdf"/>
      <path d="M70 121.5c4.1-.6 7.9 2.6 8 6.6.2 4-3.1 7.4-7.1 7.4
               -4 .1-7.3-3.3-7.2-7.3.1-3.4 2.8-6.3 6.3-6.7 z" fill="#dfdfdf"/>
    </g>

    <!--
      a few small ink motifs. `icon` is the mark set's first entry and the
      density token is 0.289 — sparse is the point. four marks, all in the
      body's negative space, none competing with the screen.
    -->
    <g stroke-width="1">
      <path d="M14.8 62.4c1.3-.4 2.1-1.6 2.2-2.9.4 1.3 1.4 2.3 2.7 2.5
               -1.3.4-2.2 1.5-2.4 2.8-.3-1.3-1.3-2.2-2.5-2.4 z"/>
      <path d="M83.9 84.6c1.2-.3 2-1.4 2.1-2.6.3 1.2 1.2 2.1 2.4 2.3
               -1.2.3-2 1.3-2.2 2.5-.2-1.2-1.1-2-2.3-2.2 z"/>
      <path d="M16.9 106.2c-1.4-.8-1.8-2.7-.8-3.9 1-1.3 3-1.3 4-.1
               1.2 1.4.7 3.7-.9 4.5-1.9.9-4.2-.1-4.9-2.1"/>
      <path d="M84.4 45.9c1.5-.6 3.2.4 3.5 2 .3 1.7-1.1 3.2-2.8 3.1
               -1.9-.1-3.1-2-2.4-3.7.5-1.2 1.8-2 3.1-1.9"/>
    </g>

    <!-- hatching on the lower-left shoulder: line density does the shading -->
    <g stroke-width="0.7" opacity="0.6">
      <path d="M13.7 88.9c1.9 1.2 3.6 2.7 5.1 4.4"/>
      <path d="M12.9 94.6c2.1 1.3 4 2.9 5.6 4.8"/>
      <path d="M13.6 100.6c1.8 1.1 3.4 2.5 4.8 4.1"/>
    </g>
  </g>
</svg>
