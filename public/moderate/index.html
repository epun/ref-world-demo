<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ref — moderate</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12.3 4.6c3.9.2 6.9 3.4 7 7.3.1 4.1-3 7.6-7.1 7.7-4 .1-7.4-3-7.5-7.1-.1-4.2 3.4-8.1 7.6-7.9z' fill='%23353534'/></svg>" />
    <style>
      /*
       * The moderator's own screen, on a phone, at a live event.
       *
       * It obeys the same taste as everything else — one paper, ink marks,
       * rule lines and borders, no filled panels, no uppercase — but it is
       * NOT part of the world and does not pretend to be. It is a tool, and
       * the thing a tool owes you at 2am is legibility.
       *
       * Held drawings are rendered as the person drew them, not as
       * creatures: you are judging the ink, and the silhouette a creature
       * turns into hides exactly the detail you need to judge.
       */
      :root {
        --paper: #dfdfdf;
        --ink: #353534;
        --line: #92928e;
        --settle: cubic-bezier(0.17, 0.72, 0.24, 1);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.5 "helvetica neue", helvetica, arial, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        max-width: 44em;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top, 0px) + 5vmin) 5vmin
          calc(env(safe-area-inset-bottom, 0px) + 5vmin);
      }
      h1 { font-size: 17px; font-weight: 400; margin: 0 0 0.2em; }
      .sub { color: var(--line); font-size: 13px; margin: 0 0 1.5em; }
      input, button, select {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--ink);
        border-radius: 13px;
        padding: 0.7em 1em;
        -webkit-tap-highlight-color: transparent;
      }
      input { width: 100%; border-color: var(--line); }
      button { cursor: pointer; transition: opacity 456ms var(--settle); }
      button:active { opacity: 0.55; }
      button:disabled { opacity: 0.3; pointer-events: none; }
      .row { display: flex; gap: 0.6em; align-items: center; flex-wrap: wrap; }
      .rule { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
      .counts { display: flex; gap: 1.4em; font-variant-numeric: tabular-nums; }
      .counts b { font-weight: 400; display: block; font-size: 22px; }
      .counts span { color: var(--line); font-size: 12px; }
      .card {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 1em;
        align-items: start;
        padding: 1em 0;
        border-top: 1px solid var(--line);
      }
      .card canvas {
        width: 96px; height: 96px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
      }
      .meta { font-size: 13px; color: var(--line); word-break: break-all; }
      .meta b { color: var(--ink); font-weight: 400; }
      .why { color: var(--ink); }
      .acts { display: flex; gap: 0.5em; margin-top: 0.7em; flex-wrap: wrap; }
      .acts button { padding: 0.5em 0.9em; font-size: 14px; }
      .empty { color: var(--line); padding: 2em 0; text-align: center; }
      #status { min-height: 1.4em; font-size: 13px; color: var(--line); }
      .danger { border-color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <h1>moderate</h1>
      <p class="sub" id="sub">the held queue, and the world's switches.</p>

      <div id="gate">
        <p class="sub">paste the moderator secret. it is kept on this device only.</p>
        <input id="secret" type="password" autocomplete="off" placeholder="moderator secret" />
        <div class="row" style="margin-top:0.8em">
          <input id="world" type="text" value="public" style="width:auto;flex:1" placeholder="world" />
          <button id="unlock">unlock</button>
        </div>
      </div>

      <div id="app" hidden>
        <div class="counts">
          <div><b id="cHeld">0</b><span>held</span></div>
          <div><b id="cAdmitted">0</b><span>in the world</span></div>
          <div><b id="cRefused">0</b><span>refused</span></div>
        </div>

        <hr class="rule" />
        <div class="row">
          <button id="toggleOpen">…</button>
          <button id="refresh">refresh</button>
          <button id="forget">forget secret</button>
        </div>
        <p id="status"></p>

        <hr class="rule" />
        <h1 id="queueTitle">held</h1>
        <p class="sub">
          nothing here has been shown to anyone. the drawer was told their
          creature is coming, and is waiting.
        </p>
        <div id="queue"></div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const KEY = 'refworld:moderator';
      let secret = '';
      let world = 'public';

      function say(s) { $('status').textContent = s; }

      async function api(method, body) {
        const res = await fetch('/api/moderate?world=' + encodeURIComponent(world), {
          method,
          headers: Object.assign({ 'x-moderator': secret },
            body ? { 'content-type': 'application/json' } : {}),
          ...(body ? { body: JSON.stringify(body) } : {}),
        });
        if (res.status === 404) throw new Error('that secret is not right');
        if (!res.ok) throw new Error('server said ' + res.status);
        return res.json();
      }

      /**
       * Draw the ink as the person drew it.
       *
       * Deliberately NOT the creature. The pipeline turns a drawing into a
       * silhouette, and a silhouette hides the detail a moderator is being
       * asked about — the whole reason this drawing is in the queue is
       * something in the strokes.
       */
      function paint(canvas, strokes) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const size = 96;
        canvas.width = size * dpr; canvas.height = size * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#353534';
        for (const s of strokes || []) {
          const pts = s && s.pts;
          if (!Array.isArray(pts) || !pts.length) continue;
          ctx.lineWidth = Math.max(1, ((s.width || 6) / 320) * size);
          ctx.beginPath();
          ctx.moveTo(pts[0][0] * size, pts[0][1] * size);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * size, pts[i][1] * size);
          if (pts.length === 1) ctx.lineTo(pts[0][0] * size + 0.01, pts[0][1] * size);
          ctx.stroke();
        }
      }

      function card(d) {
        const el = document.createElement('div');
        el.className = 'card';
        const cv = document.createElement('canvas');
        const info = document.createElement('div');
        const when = d.ts ? new Date(d.ts).toLocaleString() : 'unknown time';
        info.innerHTML =
          // Lowercased, as everywhere else a name is shown: no type in this
          // world is uppercase (TASTE §5). This page cannot import from src/,
          // so it mirrors resolveName() in src/creatures/naming.ts — the
          // moderation screen showing `Bob` while the handset showed `bob`
          // is exactly the drift that mirroring is meant to prevent.
          '<div class="meta"><b>' + (d.name ? escapeHtml(d.name.toLowerCase()) : 'unsigned') + '</b> · ' +
          escapeHtml(when) + '</div>' +
          '<div class="meta">' + escapeHtml(d.id) + '</div>' +
          (d.reason ? '<div class="meta why">flagged: ' + escapeHtml(d.reason) + '</div>' : '');
        const acts = document.createElement('div');
        acts.className = 'acts';
        for (const [label, disposition] of [['let it in', 'admitted'], ['refuse', 'refused']]) {
          if (d.disposition === disposition) continue;
          const b = document.createElement('button');
          b.textContent = label;
          b.onclick = async () => {
            b.disabled = true;
            try {
              await api('POST', { id: d.id, disposition });
              say(label === 'refuse' ? 'refused · gone from every screen within a poll'
                                     : 'admitted · it will appear within a poll');
              await load();
            } catch (e) { say(e.message); b.disabled = false; }
          };
          acts.appendChild(b);
        }
        info.appendChild(acts);
        el.append(cv, info);
        // strokes only ride along for things that need deciding on
        if (d.strokes) requestAnimationFrame(() => paint(cv, d.strokes));
        return el;
      }

      const escapeHtml = (s) => String(s).replace(/[&<>"']/g,
        (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

      let config = { closed: false, ipPerHour: 0 };

      async function load() {
        say('loading…');
        const data = await api('GET');
        config = data.config || config;
        $('cHeld').textContent = data.counts.held;
        $('cAdmitted').textContent = data.counts.admitted;
        $('cRefused').textContent = data.counts.refused;
        $('toggleOpen').textContent = config.closed ? 'open this world' : 'close this world';
        $('sub').textContent = world + (config.closed
          ? ' — closed. still viewable; no new drawings.'
          : ' — open. anyone can add.');

        const held = data.drawings.filter((d) => d.disposition === 'held').reverse();
        const refused = data.drawings.filter((d) => d.disposition === 'refused').reverse();
        const q = $('queue');
        q.innerHTML = '';
        if (!held.length && !refused.length) {
          q.innerHTML = '<p class="empty">nothing waiting. nothing refused.</p>';
        }
        for (const d of held) q.appendChild(card(d));
        if (refused.length) {
          const h = document.createElement('h1');
          h.textContent = 'refused';
          h.style.marginTop = '1.6em';
          q.appendChild(h);
          const p = document.createElement('p');
          p.className = 'sub';
          p.textContent = 'never shown. put one back if it was a mistake.';
          q.appendChild(p);
          for (const d of refused) q.appendChild(card(d));
        }
        say('up to date · ' + new Date().toLocaleTimeString());
      }

      $('unlock').onclick = async () => {
        secret = $('secret').value.trim();
        world = ($('world').value || 'public').toLowerCase().replace(/[^a-z0-9-]/g, '') || 'public';
        if (!secret) return;
        try {
          await api('GET');
          localStorage.setItem(KEY, JSON.stringify({ secret, world }));
          $('gate').hidden = true; $('app').hidden = false;
          await load();
        } catch (e) { alert(e.message); }
      };

      $('refresh').onclick = () => load().catch((e) => say(e.message));
      $('forget').onclick = () => {
        localStorage.removeItem(KEY);
        location.reload();
      };
      $('toggleOpen').onclick = async () => {
        const next = !config.closed;
        if (next && !confirm('close ' + world + '? it stays viewable; new drawings stop.')) return;
        try {
          await api('POST', { closed: next });
          await load();
        } catch (e) { say(e.message); }
      };

      // Remembered per device, never sent anywhere but this api.
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (saved && saved.secret) {
          secret = saved.secret;
          world = saved.world || 'public';
          $('gate').hidden = true; $('app').hidden = false;
          load().catch((e) => {
            say(e.message);
            $('gate').hidden = false; $('app').hidden = true;
          });
        }
      } catch {}

      // A live event moves. Refresh on its own so the queue is never stale
      // in a pocket, but only while the page is actually being looked at.
      setInterval(() => {
        if (!document.hidden && !$('app').hidden) load().catch(() => {});
      }, 30000);
    </script>
  </body>
</html>
