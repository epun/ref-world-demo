<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no / maximum-scale=1: this is a drawing surface — pinch-zoom fights strokes -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ref — companion</title>
    <!-- inline ink-blob favicon (qa audit p1): a loose hand-drawn dot in the environment ink value, no binary asset -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12.3 4.6c3.9.2 6.9 3.4 7 7.3.1 4.1-3 7.6-7.1 7.7-4 .1-7.4-3-7.5-7.1-.1-4.2 3.4-8.1 7.6-7.9z' fill='%23353534'/></svg>" />
    <style>
      /* background matches SURFACE.canvas (src/taste/tokens.ts) — the light drawing ground */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e9ebe9;
        overscroll-behavior: none;
      }
      /* fixed root: the page itself never scrolls or rubber-bands; screens own
         their layout. avoids the ios url-bar 100vh problem entirely. */
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
