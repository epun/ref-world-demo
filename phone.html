<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no / maximum-scale=1: this is a drawing surface — pinch-zoom fights strokes -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ref — companion</title>
    <!-- inline ink-blob favicon (qa audit p1): a loose hand-drawn dot in the environment ink value, no binary asset -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12.3 4.6c3.9.2 6.9 3.4 7 7.3.1 4.1-3 7.6-7.1 7.7-4 .1-7.4-3-7.5-7.1-.1-4.2 3.4-8.1 7.6-7.9z' fill='%23353534'/></svg>" />
    <!--
      The device shell (docs/DEVICE.md). Requested at parse time so the
      artwork is decoded before the module that inserts it runs — the case
      must be there in the first frame the person sees, not fade in behind
      the screen. It is a static asset in public/, so both this page and
      /draw/ paint the identical shell from one file.
    -->
    <link rel="preload" as="image" href="/device/shell.svg" type="image/svg+xml" />
    <style>
      /*
       * ONE PAPER for the whole mobile flow (docs/PHONE-STAGE.md §2/§4):
       * SURFACE.ground (src/taste/tokens.ts), the value the draw page paints
       * too. It is set here, inline, BEFORE any script runs — the seam
       * between /draw/ and this document is invisible only if there is
       * nothing different to flash to. The drawing pad's interior keeps
       * SURFACE.canvas, so the figure/ground separation survives.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #dfdfdf;
        overscroll-behavior: none;
      }
      /* fixed root: the page itself never scrolls or rubber-bands; the stage
         owns the layout. avoids the ios url-bar 100vh problem entirely. */
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
    </style>
  </head>
  <body>
    <!-- vendored MQTT client, same tag the world and draw pages carry: the
         emote uplink publishes on the room's own topic (src/net/emoteUplink.ts) -->
    <script src="/vendor/mqtt.min.js"></script>
    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
