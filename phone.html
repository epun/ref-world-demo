<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no / maximum-scale=1: this is a drawing surface — pinch-zoom fights strokes -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ref — companion</title>
    <!-- inline ink-blob favicon (qa audit p1): a loose hand-drawn dot in the environment ink value, no binary asset -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12.3 4.6c3.9.2 6.9 3.4 7 7.3.1 4.1-3 7.6-7.1 7.7-4 .1-7.4-3-7.5-7.1-.1-4.2 3.4-8.1 7.6-7.9z' fill='%23353534'/></svg>" />
    <!--
      The device shell (docs/DEVICE.md). Requested at parse time so the
      artwork is decoded before the module that inserts it runs — the case
      must be there in the first frame the person sees, not fade in behind
      the screen. It is a static asset in public/, so both this page and
      /draw/ paint the identical shell from one file.
    -->
    <link rel="preload" as="image" href="/device/shell.svg" type="image/svg+xml" />
    <style>
      /*
       * ONE PAPER for the whole mobile flow (docs/PHONE-STAGE.md §2/§4):
       * SURFACE.ground (src/taste/tokens.ts), the value the draw page paints
       * too. It is set here, inline, BEFORE any script runs — the seam
       * between /draw/ and this document is invisible only if there is
       * nothing different to flash to. The drawing pad's interior keeps
       * SURFACE.canvas, so the figure/ground separation survives.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #dfdfdf;
        overscroll-behavior: none;
      }
      /* fixed root: the page itself never scrolls or rubber-bands; the stage
         owns the layout. avoids the ios url-bar 100vh problem entirely. */
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }

      /*
       * THE CASE, PAINTED BEFORE ANY SCRIPT (docs/PHONE-STAGE.md §4.1).
       *
       * Measured cause of the reported seam flash: /draw/ carries its device
       * in the document, this page built its device in src/phone/device.ts —
       * which cannot run until ~840kB of module has been fetched, parsed and
       * executed, and until boot()'s `await createSession()` (a dynamic
       * import of the relay client) has resolved. Screencast measurement at
       * 390x844: the last frame of /draw/ showed the case, the first frame of
       * this document showed bare paper, and the case did not come back for
       * ~960ms — one frame at 330x the running median luma delta, then a
       * second one when it returned. The paper never changed value; what
       * flashed was the whole device disappearing and reappearing.
       *
       * So the case is markup now, exactly as it is on /draw/, and
       * mountDevice() ADOPTS it rather than building a second one. The first
       * paint of this document is then the last frame of the previous one:
       * same shell, same box, same empty well at the wait measure, same bare
       * key field. Nothing to flash to.
       *
       * Every value below is MIRRORED from src/phone/device.ts — DEVICE_VIEWBOX,
       * DEVICE_TOP_AIR_PX (42), DEVICE_BOTTOM_AIR_PX (10), DEVICE_WELL, and
       * SURFACE.ground. public/draw/index.html mirrors the same numbers for
       * the same reason (a standalone document cannot import from src/), and
       * DEVICE §3 makes them binding: they may not be edited on one side
       * only. device.ts re-declares them identically at runtime, so nothing
       * here can drift into a second geometry — it can only be stale, and
       * stale would move the case on both pages at once, not one of them.
       *
       * The shell is a physical object and it never moves ON ITS OWN
       * (DEVICE §1a). The two exceptions are the same move in opposite
       * directions, both by ruling: it slides DOWN out of the way when the
       * person goes to look at the world, and it slides UP into place when
       * they come back from it.
       *
       * The arrival is declared HERE, inline, rather than in
       * src/phone/device.ts — the module is ~840kB and does not run for
       * something like a second, and a case that waits for it would leave
       * the person looking at bare paper for that whole second before
       * anything moved. Mirrored into device.ts all the same (DEVICE §3).
       */
      .device {
        transition: transform 912ms cubic-bezier(0.17, 0.72, 0.24, 1);
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: 100%;
        height: 100dvh;
        box-sizing: border-box;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) 0
          calc(env(safe-area-inset-bottom, 0px) + 16px);
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #dfdfdf;
        container-type: size;
      }
      /*
       * Off the bottom of the screen, for the first paint only. Removed on
       * the next frame (see the inline script below the case), which is
       * what turns it into a slide rather than a jump. Same 106% and same
       * duration as `.device.leaving`, so the way in and the way out are
       * one move played both directions.
       */
      .device.arriving {
        transform: translateY(106%);
      }
      .device-box {
        position: relative;
        width: min(100cqw, calc(100cqh * 100 / 190));
        aspect-ratio: 100 / 190;
      }
      .device-shell {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }
      .device-well {
        position: absolute;
        left: 15%;
        top: 22.619%;
        width: 70%;
        height: 51.1905%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .device-keys {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      The case, in the document (see the note above). src/phone/device.ts
      adopts this exact subtree — the stage mounts into .device-well and the
      key rows into .device-keys — so the person never sees a frame without
      it. The well is empty here, which is precisely what the last frame of
      /draw/ shows: the pad has faded out and the core has already travelled
      to the wait measure.
    -->
    <div class="device">
      <div class="device-box">
        <img
          class="device-shell"
          src="/device/shell.svg"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
        <div class="device-well"></div>
        <div class="device-keys"></div>
      </div>
    </div>
    <!-- vendored MQTT client, same tag the world and draw pages carry: the
         emote uplink publishes on the room's own topic (src/net/emoteUplink.ts) -->
    <!--
      ARRIVING FROM THE WORLD (user ruling, 2026-08-25).

      Inline and synchronous, so the case is already off-screen in the
      FIRST painted frame — a class added by the module would animate the
      device downwards first, which is the move backwards.

      Only for `?from=world`. The /draw/ handoff must never take this path:
      that seam works precisely because the case is already exactly where
      it was in the previous document (PHONE-STAGE §4.1), and sliding it in
      there would replace an invisible seam with a visible one.
    -->
    <script>
      (function () {
        try {
          if (new URLSearchParams(location.search).get('from') !== 'world') return;
          var el = document.querySelector('.device');
          if (!el) return;
          el.classList.add('arriving');
          // Two frames: the first paints it off-screen, the second starts
          // the transition from there. One frame is not reliably enough —
          // the style change can be coalesced into the initial paint and
          // then there is nothing to transition FROM.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              el.classList.remove('arriving');
            });
          });
        } catch (e) {}
      })();
    </script>
    <script src="/vendor/mqtt.min.js"></script>
    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
